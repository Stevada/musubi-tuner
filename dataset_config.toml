# FLUX.1 Kontext i2i LoRA Training Dataset Configuration
#
# This configuration file defines the dataset for FLUX image-to-image training.
# FLUX Kontext takes a control/reference image and generates a new image based on the prompt.
#
# IMPORTANT: Use absolute paths, not relative paths!

[general]
# Target resolution for training images
# Common resolutions: [1024, 1024], [960, 544], [768, 1344]
resolution = [512, 512]

# Caption file extension
caption_extension = ".txt"

# Batch size - keep at 1 for single GPU training
batch_size = 1

# Enable bucketing to handle images with different aspect ratios
enable_bucket = true

# Don't upscale images smaller than target resolution
bucket_no_upscale = false


# ============================================================================
# Dataset Definition (Directory-based approach)
# ============================================================================
# This approach uses separate directories for target images and control images,
# with captions in .txt files alongside the target images.

[[datasets]]
# Directory containing target images (your desired outputs)
# Example: /home/user/datasets/my_flux_dataset/target_images
image_directory = "/root/musubi-tuner/dataset/target_Images"

# Directory containing control/reference images (source images for i2i)
# Filenames MUST match the target image filenames (ignoring file extension)
# Example: /home/user/datasets/my_flux_dataset/control_images
control_directory = "/root/musubi-tuner/dataset/control_images"

# Directory where cached latents and text encoder outputs will be stored
# This will be created automatically if it doesn't exist
# Example: /home/user/datasets/my_flux_dataset/cache
cache_directory = "/root/musubi-tuner/dataset/cache"

# Number of times to repeat this dataset during training
# Increase this for small datasets to see more epochs
# Recommended: 1 for >200 images, 2-3 for <50 images
num_repeats = 3

# Optional: disable control image resizing (default: false)
# If true, control images won't be resized to match target resolution
# flux_kontext_no_resize_control = false


# ============================================================================
# Alternative: JSONL-based Dataset Definition (commented out)
# ============================================================================
# Uncomment and use this approach if you prefer to specify image paths
# in a JSONL metadata file instead of using directory structure.
#
# [[datasets]]
# # Path to JSONL file with metadata
# # Each line should be a JSON object with:
# # {"image_path": "/path/to/target.png", "control_path": "/path/to/control.png", "caption": "A scene"}
# # Example: /home/user/datasets/my_flux_dataset/metadata.jsonl
# image_jsonl_file = "/absolute/path/to/metadata.jsonl"
#
# # Cache directory
# cache_directory = "/absolute/path/to/cache"
#
# # Number of repeats
# num_repeats = 1
#
# # Optional: disable control image resizing
# flux_kontext_no_resize_control = false


# ============================================================================
# Multiple Datasets Example (commented out)
# ============================================================================
# You can define multiple dataset sections to train on multiple datasets
# at the same time. Just add additional [[datasets]] blocks.
#
# [[datasets]]
# image_directory = "/absolute/path/to/dataset1/target_images"
# control_directory = "/absolute/path/to/dataset1/control_images"
# cache_directory = "/absolute/path/to/dataset1/cache"
# num_repeats = 2
#
# [[datasets]]
# image_directory = "/absolute/path/to/dataset2/target_images"
# control_directory = "/absolute/path/to/dataset2/control_images"
# cache_directory = "/absolute/path/to/dataset2/cache"
# num_repeats = 1


# ============================================================================
# Notes on Dataset Structure
# ============================================================================
#
# For directory-based approach, your dataset should look like:
#
# flux_dataset/
# ├── target_images/
# │   ├── image1.png
# │   ├── image1.txt          # Caption: "A person waving hello"
# │   ├── image2.png
# │   ├── image2.txt          # Caption: "A person sitting on a chair"
# │   └── ...
# ├── control_images/
# │   ├── image1.png          # Reference image (MUST match target filename!)
# │   ├── image2.png
# │   └── ...
# └── cache/                  # Auto-created during caching
#
# Caption Guidelines:
# - Describe the desired OUTPUT scene, not just the control image
# - The control image provides the reference/structure
# - Examples: "A person in a futuristic city", "Character wearing a red dress"
# - Keep captions concise and descriptive
#
# Filename Matching:
# - Control image filename MUST match target image filename
# - File extensions can differ (e.g., target.png <-> control.jpg is OK)
# - Example matches: image1.png <-> image1.jpg
#
# Image Requirements:
# - Supported formats: PNG, JPG, JPEG, WEBP
# - Recommended resolution: 1024x1024 or similar (will be bucketed)
# - Control images provide the reference structure for i2i generation
# - Target images show the desired output for that control image
#
# Control Image Behavior:
# - By default, control images are resized to match target resolution
# - Set flux_kontext_no_resize_control = true to disable resizing
# - Only ONE control image per target image is supported
#
# FLUX vs Qwen-Image-Edit:
# - FLUX Kontext: 1 control image per target
# - Qwen-Image-Edit: Multiple control images supported (image1_0.png, image1_1.png)
