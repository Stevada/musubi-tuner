# Sample Dataset Configuration for Qwen-Image-Edit Character Consistency LoRA Training
#
# This is a template configuration file. Copy this file and update the paths
# to point to your actual dataset directories.
#
# IMPORTANT: Use absolute paths, not relative paths!
# Replace "/absolute/path/to/" with your actual directory paths.

[general]
# Target resolution for training images
# Images will be resized/bucketed to this resolution or similar aspect ratios
resolution = [512, 512]

# Caption file extension
caption_extension = ".txt"

# Batch size - keep at 1 for single GPU training with limited VRAM
# The actual batch size is controlled by bucket batching
batch_size = 1

# Enable bucketing to handle images with different aspect ratios
# This groups images of similar aspect ratios together
enable_bucket = true

# Don't upscale images smaller than target resolution
bucket_no_upscale = false


# ============================================================================
# Dataset Definition (Directory-based approach)
# ============================================================================
# This approach uses separate directories for target images, control images,
# and captions in .txt files alongside the target images.

[[datasets]]
# Directory containing target images (your goal outputs)
# Example: /home/user/datasets/my_character/target_images
image_directory = "/root/musubi-tuner/dataset/target_Images"

# Directory containing control images (reference character images)
# Filenames MUST match the target image filenames (ignoring file extension)
# Example: /home/user/datasets/my_character/control_images
control_directory = "/root/musubi-tuner/dataset/control_images"

# Directory where cached latents and text encoder outputs will be stored
# This will be created automatically if it doesn't exist
# Example: /home/user/datasets/my_character/cache
cache_directory = "/root/musubi-tuner/dataset/cache"

# Number of times to repeat this dataset during training
# Increase this for small datasets to see more epochs
# Recommended: 1 for >200 images, 2-3 for <50 images
num_repeats = 3


# ============================================================================
# Alternative: JSONL-based Dataset Definition (commented out)
# ============================================================================
# Uncomment and use this approach if you prefer to specify image paths
# in a JSONL metadata file instead of using directory structure.
#
# [[datasets]]
# # Path to JSONL file with metadata
# # Each line should be a JSON object with:
# # {"image_path": "/path/to/target.png", "control_path": "/path/to/control.png", "caption": "A person waving"}
# # Example: /home/user/datasets/my_character/metadata.jsonl
# image_jsonl_file = "/absolute/path/to/metadata.jsonl"
#
# # Cache directory
# cache_directory = "/absolute/path/to/cache"
#
# # Number of repeats
# num_repeats = 1


# ============================================================================
# Multiple Datasets Example (commented out)
# ============================================================================
# You can define multiple dataset sections to train on multiple datasets
# at the same time. Just add additional [[datasets]] blocks.
#
# [[datasets]]
# image_directory = "/absolute/path/to/dataset1/target_images"
# control_directory = "/absolute/path/to/dataset1/control_images"
# cache_directory = "/absolute/path/to/dataset1/cache"
# num_repeats = 2
#
# [[datasets]]
# image_directory = "/absolute/path/to/dataset2/target_images"
# control_directory = "/absolute/path/to/dataset2/control_images"
# cache_directory = "/absolute/path/to/dataset2/cache"
# num_repeats = 1


# ============================================================================
# Notes on Dataset Structure
# ============================================================================
#
# For directory-based approach, your dataset should look like:
#
# your_dataset/
# ├── target_images/
# │   ├── char01_wave.png
# │   ├── char01_wave.txt      # Caption: "A person waving hello"
# │   ├── char01_sit.png
# │   ├── char01_sit.txt       # Caption: "A person sitting on a chair"
# │   └── ...
# ├── control_images/
# │   ├── char01_wave.png      # Reference character image (MUST match target filename!)
# │   ├── char01_sit.png
# │   └── ...
# └── cache/                    # Auto-created during caching
#
# Caption Guidelines:
# - Describe the ACTION or POSE, not the character appearance
# - Examples: "A person jumping", "Standing with arms crossed"
# - The character information comes from the control image
# - Keep captions concise and descriptive
#
# Filename Matching:
# - Control image filename MUST match target image filename
# - File extensions can differ (e.g., target.png -> control.jpg is OK)
# - Example matches: char01_wave.png <-> char01_wave.jpg
#
# Image Requirements:
# - Supported formats: PNG, JPG, JPEG, WEBP
# - Recommended resolution: 1024x1024 or similar (will be bucketed)
# - Control images should clearly show the character you want to preserve
# - Target images should show the character in the desired new pose/scene
#
# Multiple Control Images (for Qwen-Image-Edit-2509/2511):
# - You can use multiple control images per target by naming them:
#   - target: image1.png
#   - controls: image1_0.png, image1_1.png, image1_2.png
#   - or: image1_0000.png, image1_0001.png, image1_0002.png
